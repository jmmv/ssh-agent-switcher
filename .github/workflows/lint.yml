name: Lint

on: push

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: sudo sh -ec 'echo "set man-db/auto-update false" | debconf-communicate; dpkg-reconfigure man-db'
            - uses: cargo-bins/cargo-binstall@main
            - run: sudo apt-get update
            - run: sudo apt-get install --yes shellcheck
            - run: cargo binstall --no-confirm cargo-machete
            - run: cargo binstall --no-confirm prek
            - run: prek run --all-files
